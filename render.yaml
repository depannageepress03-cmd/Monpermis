# Blueprint Render — Monpermis.bj
# Dashboard : New → Blueprint → repo depannageepress03-cmd/Monpermis
# Les secrets (Mongo, JWT, SMTP, FedaPay, Cloudinary, Google) se saisissent une fois ;
# les URLs publiques sont figées ici pour éviter un front pointant vers localhost.

services:
  - type: web
    name: monpermis-api
    runtime: node
    rootDir: server
    plan: free
    branch: main
    autoDeployTrigger: commit
    # Build l’API + le portail moniteur (SPA servie à la racine de monpermis-api.onrender.com)
    # --include=dev : NODE_ENV=production omettrait sinon typescript/vite
    # VITE_API_URL vide : mêmes origine que l’API → fetch('/api/...')
    buildCommand: npm install && cd .. && npm install --prefix moniteur --include=dev && VITE_API_URL= npm run build --prefix moniteur && rm -rf server/web-dist && mkdir -p server/web-dist && cp -r moniteur/dist/. server/web-dist/
    startCommand: npm start
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
        - moniteur/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://monpermis-api.onrender.com
      - key: ADMIN_CLIENT_URL
        value: https://monpermis-admin.onrender.com
      - key: MONITEUR_CLIENT_URL
        value: https://monpermis-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://monpermis-api.onrender.com,https://monpermis-admin.onrender.com,https://monpermis-web.onrender.com
      - key: API_PUBLIC_URL
        value: https://monpermis-api.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FEDAPAY_PUBLIC_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_ENVIRONMENT
        value: live
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false
      - key: FEDAPAY_CALLBACK_URL
        value: https://monpermis-api.onrender.com/abonnement
      - key: ALLOW_ADMIN_REGISTRATION
        value: "false"
      - key: MOBILE_SCHEME
        value: monpermis
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        sync: false

  - type: web
    name: monpermis-admin
    runtime: static
    rootDir: administration
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - administration/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://monpermis-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Miroir optionnel du portail moniteur (même app que la racine de l’API).
  - type: web
    name: monpermis-web
    runtime: static
    rootDir: moniteur
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - moniteur/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://monpermis-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
