# Blueprint Render — Monpermis.bj
# Connecter le repo GitHub, puis "New Blueprint" / ou créer les services manuellement.

services:
  - type: web
    name: monpermis-api
    runtime: node
    rootDir: server
    plan: free
    # Build l’API + le portail moniteur (SPA servie à la racine de monpermis-api.onrender.com)
    # --include=dev : NODE_ENV=production sur Render omettrait sinon typescript/vite/@types
    buildCommand: npm install && cd .. && npm install --prefix moniteur --include=dev && VITE_API_URL= npm run build --prefix moniteur && rm -rf server/web-dist && mkdir -p server/web-dist && cp -r moniteur/dist/. server/web-dist/
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_CLIENT_URL
        sync: false
      - key: MONITEUR_CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FEDAPAY_PUBLIC_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_ENVIRONMENT
        value: live
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false
      - key: FEDAPAY_CALLBACK_URL
        sync: false
      - key: ALLOW_ADMIN_REGISTRATION
        value: "false"
      - key: MOBILE_SCHEME
        value: monpermis
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Cloudinary — audios + images/vidéos cours (secret serveur uniquement, jamais côté frontend)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        sync: false

  - type: web
    name: monpermis-admin
    runtime: static
    rootDir: administration
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Ancien site apprenant (monpermis-web) : désormais le portail moniteur.
  # Les apprenants utilisent uniquement l’app mobile — ne plus builder src/ (web apprenant).
  - type: web
    name: monpermis-web
    runtime: static
    rootDir: moniteur
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
