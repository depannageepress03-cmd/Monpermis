<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monpermis — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0;background:#F5F7FB}a{color:#067A37}a:hover{color:#0A1B3D}input::placeholder{color:#8A93A8}</style>
<style>
/* Présentation de la maquette (pas du design de l'app) */
html,body{margin:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box;background:#E6EBF3}
.mp-frame{border-radius:44px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(10,27,61,.45);flex-shrink:0}
body.mp-embed{padding:0;background:transparent;min-height:0}

</style>
</head>
<body>
<script>if (location.hash === '#embed') document.body.classList.add('mp-embed');</script>
<div class="mp-frame">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 56px 22px 28px; background: #F5F7FB; font-family: 'Plus Jakarta Sans', sans-serif; color: #0A1B3D; display: flex; flex-direction: column; gap: 20px">
<div style="position: absolute; top: -100px; right: -100px; width: 280px; height: 280px; border-radius: 50%; background: rgba(11,170,79,0.12); filter: blur(60px)"></div>

<div style="width: 46px; height: 46px; border-radius: 15px; background: #FFFFFF; box-shadow: 0 6px 18px -8px rgba(10,27,61,0.25); overflow: hidden; display: flex; align-items: center; justify-content: center"><img src="assets/logo.png" alt="Monpermis.bj" style="width: 62px; height: 62px; object-fit: cover"></div>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
<h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Content de te revoir</h1>
<p style="margin: 0; font-size: 14.5px; color: #5B6680">Connecte-toi pour reprendre ta préparation.</p>
</div>
<div style="height: 52px; box-sizing: border-box; padding: 5px; border-radius: 26px; background: #E8EDF6; display: flex; gap: 4px">
<button type="button" style="flex-grow: 1; flex-basis: 0; border: 0; border-radius: 21px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: #FFFFFF; color: #0A1B3D; box-shadow: 0 4px 12px -4px rgba(10,27,61,0.25)">E-mail</button>
<button type="button" style="flex-grow: 1; flex-basis: 0; border: 0; border-radius: 21px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: transparent; color: #5B6680; box-shadow: none">Téléphone</button>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; flex-direction: column; gap: 8px">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"></rect><path d="m4 7 8 6 8-6"></path></svg>

</div>
</div>

</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #3C4760"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0BAA4F; margin: 0">Rester connecté 7 jours</label>
<a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none">Mot de passe oublié ?</a>
</div>
</div>
<a href="Home.html" style="height: 58px; border-radius: 29px; background: #0A1B3D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 0 18px 32px -14px rgba(10,27,61,0.65)">Se connecter<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB400" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<div style="display: flex; align-items: center; gap: 12px; color: #8A93A8; font-size: 12.5px; font-weight: 600">
<div style="flex-grow: 1; height: 1px; background: #E1E6EF"></div>ou<div style="flex-grow: 1; height: 1px; background: #E1E6EF"></div>
</div>
<button type="button" style="height: 56px; border-radius: 28px; border: 1.5px solid #E1E6EF; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #0A1B3D; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #F1F4F9; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 800; font-size: 14px">G</span>Continuer avec Google</button>
<div style="margin-top: auto; text-align: center; font-size: 14px; color: #5B6680">Pas encore de compte ? <a href="#" style="font-weight: 800; text-decoration: none">Créer un compte</a></div>
</div>
</div>
