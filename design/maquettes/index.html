<title>Monpermis.bj — Maquettes UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--navy:#0A1B3D;--green:#0BAA4F;--yellow:#FFB400;--bg:#EEF2F8;--muted:#5B6680}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;color:var(--navy)}
header{display:flex;align-items:center;gap:16px;padding:32px 40px 8px}
.logo{width:56px;height:56px;border-radius:17px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -10px rgba(10,27,61,.35)}
.logo img{width:76px;height:76px;object-fit:cover}
h1{margin:0;font-family:'Sora',sans-serif;font-size:26px;letter-spacing:-.02em}
h1 span{color:var(--green)}
header p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:14px}
h2{font-family:'Sora',sans-serif;font-size:20px;margin:36px 40px 16px}
.grid{display:flex;flex-wrap:wrap;gap:28px;padding:0 40px}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
figcaption{font-weight:700;font-size:14px}
figcaption a{color:var(--navy)}
.phone{width:273px;height:591px;border-radius:32px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -30px rgba(10,27,61,.5)}
.phone iframe{width:390px;height:844px;border:0;transform:scale(.7);transform-origin:0 0}
.desk{width:936px;max-width:100%;height:624px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -30px rgba(10,27,61,.5)}
.desk iframe{width:1440px;height:960px;border:0;transform:scale(.65);transform-origin:0 0}
footer{padding:40px;color:var(--muted);font-size:13px;font-weight:600}
</style>
</head>
<body>
<header>
<div class="logo"><img src="assets/logo.png" alt="Monpermis.bj"></div>
<div><h1>Monpermis<span>.bj</span> — Maquettes UI</h1><p>Clique sur un titre pour ouvrir l'écran en grand.</p></div>
</header>
